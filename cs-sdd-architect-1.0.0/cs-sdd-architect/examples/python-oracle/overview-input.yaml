sections:
  Identificação e controle: Projeto python-oracle, fictício. Documento 1.0, formato
    1.0, responsável pendente. Fontes/revisões no YAML.
  Resumo executivo: 'Problema: redigitação de lotes. MVP: validar lote e persistir
    dados, excluindo interface web e postagem externa. Priorizar integridade antes
    de agendamento, pois duplicação compromete valor. Métrica: lotes sem redigitação
    por período, fonte futura de execução; meta pendente. Alternativa de macro descartada
    como proposta por dificultar retomada auditável.'
  Visão de produto: Síntese do MVP e valor acima; prioridades, métrica e alternativas
    em [spec](spec.md).
  Mapa funcional: 'FUN-01 — Importar lote. Origem: [REQ-01](spec.md); entradas/saídas
    e dependências ali descritas. Estado planejado.'
  Visão de engenharia: 'Python e Oracle/PLSQL confirmados sem versões. Dois componentes:
    leitor/validador Python e persistência Oracle. Contrato e chave de unicidade precisam
    confirmação antes de implementação. Transação proposta por lote; COMMIT sob responsabilidade
    do coordenador a confirmar, sem criar package real. Fonte: [spec](spec.md).'
  Dados e conceitos: Lote, registro e checkpoint. Retenção pendente; chave do lote
    a confirmar.
  Fluxos: "**Fluxo de negócio proposto**, fonte [REQ-01](spec.md); não é fluxo de\
    \ desenvolvimento.\n\n```mermaid\nflowchart TD\n  A([Inicio]) --> B[\"Validar\
    \ lote e chave\"]\n  B --> C{\"Permissao e dados validos?\"}\n  C -->|Nao| E[\"\
    Interromper e registrar pendencia\"]\n  C -->|Sim| D[\"Persistir e registrar checkpoint\"\
    ]\n  D --> F([Fim])\n```\n\nDescrição textual: iniciar, validar lote e chave,\
    \ verificar permissão e dados; inválidos interrompem com pendência, válidos seguem\
    \ para persistir e registrar checkpoint e fim.\n\n**Mapa mental**, fonte [produto/engenharia](spec.md).\n\
    \n```mermaid\nmindmap\n  root((python-oracle))\n    Produto\n      Importar lote\n\
    \    Usuarios\n      Perfis da entrada\n    Modulos\n      Componentes do spec\n\
    \    Dados\n      Entidades do spec\n    Integracoes\n      Contratos pendentes\n\
    \    Regras\n      Base ficticia\n    Operacao\n      Retomada a validar\n```\n\
    \nDescrição textual: projeto organizado em produto, usuários, módulos, dados,\
    \ integrações, regras e operação; os nós remetem aos conceitos do spec. Sintaxe/renderização:\
    \ consultar relatório de avaliação, não presumir."
  Orientações para uso: 'PROC-01: objetivo e público conhecidos na entrada; pré-condição:
    acesso autorizado ao ambiente. Passos operacionais: pendentes de interface/exportação.
    Resultado esperado: REQ-01; exceções: permissões e dados inválidos. Estado: planejado,
    não validado; coletar evidência do sistema. Nenhum botão ou comando foi presumido.'
  Falhas e suporte: Falhas relevantes e recuperação em [spec](spec.md). Mensagens
    e encaminhamento real pendentes; não inventar códigos.
  Operação: Agendador e credenciais pendentes. Retomada lê checkpoint; lote incerto
    requer reconciliação. Logs não contêm conteúdo sensível do arquivo; métricas de
    conclusão/falha e responsável por alerta a confirmar.
  Governança: Base fictícia 1.0-ficticia, não é padrão real; [regras locais](projeto-regras.md).
    Gates não submetidos; nenhum aceite humano real.
  Estado do projeto: FUN-01 planejada. Implementação e verificação de negócio não
    executadas. Documentação conceitual candidata à revisão; manual validado pendente
    de execução e evidências.
