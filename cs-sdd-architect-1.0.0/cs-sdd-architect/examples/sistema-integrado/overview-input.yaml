sections:
  Identificação e controle: Projeto sistema-integrado, fictício. Documento 1.0, formato
    1.0, responsável pendente. Fontes/revisões no YAML.
  Resumo executivo: 'Problema: envio sem controle de aprovação. MVP: solicitação,
    decisão de gestor e envio rastreável; excluir reprocessamento automático irrestrito
    e manual final. Priorizar autorização/estado antes de envio. Métrica: envios vinculados
    a aprovação, fonte futura do registro; meta pendente. Alternativa de envio direto
    rejeitada como proposta por contrariar necessidade de controle.'
  Visão de produto: Síntese do MVP e valor acima; prioridades, métrica e alternativas
    em [spec](spec.md).
  Mapa funcional: 'FUN-01 — Solicitar e aprovar envio. Origem: [REQ-01](spec.md);
    entradas/saídas e dependências ali descritas. Estado planejado.'
  Visão de engenharia: 'APEX: interface e autorização; PL/SQL: transição de estado;
    Python: integração; serviço externo: destino. Versões, contrato e ferramentas
    pendentes. Nenhuma implementação executada. Autorização de gestor deve ocorrer
    no servidor. Fonte: [spec](spec.md).'
  Dados e conceitos: 'Solicitação, decisão e tentativa de envio. Estados: proposta,
    aprovada, rejeitada, envio pendente e resultado incerto; retenção pendente.'
  Fluxos: "**Fluxo de negócio proposto**, fonte [REQ-01](spec.md); não é fluxo de\
    \ desenvolvimento.\n\n```mermaid\nflowchart TD\n  A([Inicio]) --> B[\"Registrar\
    \ solicitacao\"]\n  B --> C{\"Gestor autorizado aprova?\"}\n  C -->|Nao| R[\"\
    Rejeitar sem enviar\"]\n  C -->|Sim| D[\"Enviar pelo Python\"]\n  D --> E{\"Resultado\
    \ confirmado?\"}\n  E -->|Sim| F([Concluir])\n  E -->|Nao| G[\"Operador reconcilia\
    \ sem repetir POST\"]\n```\n\nDescrição textual: registrar solicitação, gestor\
    \ decide; rejeitada não envia; aprovada segue para Python; resultado confirmado\
    \ conclui, incerto exige reconciliação humana sem repetição.\n\n**Mapa mental**,\
    \ fonte [produto/engenharia](spec.md).\n\n```mermaid\nmindmap\n  root((sistema-integrado))\n\
    \    Produto\n      Solicitar e aprovar envio\n    Usuarios\n      Perfis da entrada\n\
    \    Modulos\n      Componentes do spec\n    Dados\n      Entidades do spec\n\
    \    Integracoes\n      Contratos pendentes\n    Regras\n      Base ficticia\n\
    \    Operacao\n      Retomada a validar\n```\n\nDescrição textual: projeto organizado\
    \ em produto, usuários, módulos, dados, integrações, regras e operação; os nós\
    \ remetem aos conceitos do spec. Sintaxe/renderização: consultar relatório de\
    \ avaliação, não presumir."
  Orientações para uso: 'PROC-01: objetivo e público conhecidos na entrada; pré-condição:
    acesso autorizado ao ambiente. Passos operacionais: pendentes de interface/exportação.
    Resultado esperado: REQ-01; exceções: permissões e dados inválidos. Estado: planejado,
    não validado; coletar evidência do sistema. Nenhum botão ou comando foi presumido.'
  Falhas e suporte: Falhas relevantes e recuperação em [spec](spec.md). Mensagens
    e encaminhamento real pendentes; não inventar códigos.
  Operação: Operador trata envio incerto com consulta autorizada ao destino; não reenvia
    até conclusão. Implantação e suporte pendentes; recuperação precisa respeitar
    estado remoto e local.
  Governança: Base fictícia 1.0-ficticia, não é padrão real; [regras locais](projeto-regras.md).
    Gates não submetidos; nenhum aceite humano real.
  Estado do projeto: FUN-01 planejada. Implementação e verificação de negócio não
    executadas. Documentação conceitual candidata à revisão; manual validado pendente
    de execução e evidências.
