    - [security.md](security.md) — revisão 1.1.'
  Pendências documentais: 'Confirmar versões, padrões reais, aprovadores e interface.
    Sem material para manual validado. Histórico: 1.0 consolidação inicial fictícia,
    nenhuma aprovação atribuída. Histórico 1.1: CHG-01 altera fluxo, mapa mental e
    procedimento; origem solicitação fictícia, sem atribuir aprovação nem implementação.
    Reavaliar autorização do operador, IPC e revisão crítica.'
